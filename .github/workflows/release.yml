# Builds the unsigned Apple-silicon dmg on every v* tag and attaches it to a GitHub
# Release. Signing/notarisation is intentionally off (no Apple Developer identity);
# first launch needs right-click ▸ Open, as INSTALL.md explains.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --mac dmg zip --arm64
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.dmg
            dist/*.zip
