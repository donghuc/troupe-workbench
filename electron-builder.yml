appId: com.troupe.app
productName: Troupe
copyright: © 2026 Hien Do

afterPack: scripts/adhoc-sign.cjs

directories:
  buildResources: build
  output: dist

# No auto-publish and no update feed: package.json's `repository` field would otherwise
# make electron-builder configure a GitHub publisher and demand GH_TOKEN even with
# --publish never. Releases are attached by the GitHub Actions workflow instead.
publish: null

# Allow-list (D-089): only the built app and package.json ship. Runtime deps for main
# (better-sqlite3, chokidar, smol-toml) are added by electron-builder from
# `dependencies`; renderer libraries are devDependencies because Vite bundles them.
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - '!**/*.map'
  - '!out/*.tgz'
  # better-sqlite3 13 loads prebuilds/<platform>-<arch>.node; ship only the macOS ones,
  # without the bundled SQLite sources.
  - '!node_modules/better-sqlite3/{deps,src,build}/**'
  - '!node_modules/better-sqlite3/binding.gyp'
  - '!node_modules/better-sqlite3/prebuilds/{linux,linuxmusl,win32}-*.node'
  - '!node_modules/@napi-rs/**'
  - '!node_modules/**/{README,CHANGELOG,HISTORY}*'
  - '!node_modules/**/*.{md,d.ts,map}'

# The native module must live outside the asar so it can load.
asarUnpack:
  - '**/*.node'

# The UI is English; keep Vietnamese for system dialogs. Drops ~48 MB of Electron locales.
electronLanguages:
  - en
  - vi

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  # macOS 26 (Tahoe) icon: the Icon Composer bundle in build/Troupe.icon is compiled by
  # scripts/compile-icon.sh into build/Assets.car; CFBundleIconName tells macOS to use
  # it. build/icon.icns (from icon.png) stays as the fallback for macOS 15 and older.
  extraResources:
    - from: build/Assets.car
      to: Assets.car
    # D-117: the `troupe` command; Settings ▸ Tools ▸ Command line installs a wrapper that runs it.
    - from: resources/troupe
      to: troupe
  extendInfo:
    CFBundleIconName: Troupe
  # No Apple Developer ID: electron-builder doesn't sign (identity: null); the afterPack hook
  # ad-hoc signs instead, so a downloaded copy isn't reported as "damaged" (2.2.1).
  # First launch still needs Privacy & Security ▸ Open Anyway (see INSTALL.md).
  identity: null
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
